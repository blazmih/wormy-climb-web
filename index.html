<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Wormy Climb</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12151c; overflow: hidden; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* phone-shaped game area: full screen on phones, a 9:19 column on desktop */
    #c { height: 100%; aspect-ratio: 9 / 19; max-width: 100%; display: block; touch-action: none; background: #12151c; }
    @media (max-aspect-ratio: 9/16) { #c { width: 100%; height: 100%; aspect-ratio: auto; } }
    #load { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
            color: #f2bf6b; font: 600 20px -apple-system, Helvetica, sans-serif; }
    #bar { width: 60%; max-width: 260px; height: 8px; border-radius: 4px; background: #2b2f3a; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #f2bf6b; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" tabindex="-1"></canvas></div>
  <div id="load">Wormy Climb<div id="bar"><div id="fill"></div></div></div>
  <script src="Build/Web.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#c"), {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "blazmih",
      productName: "Wormy Climb",
      productVersion: "0.2.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, p => { document.querySelector("#fill").style.width = Math.round(p * 100) + "%"; })
    .then(() => document.querySelector("#load").remove())
    .catch(e => { document.querySelector("#load").textContent = "Couldn't start the game: " + e; });
  </script>
</body>
</html>
